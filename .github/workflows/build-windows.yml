name: Build Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Reveal for Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable, Windows x64 MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Runs `beforeBuildCommand` (pnpm build -> dist/) then `cargo build --release`
      # and bundles the installers. The host runner is already
      # x86_64-pc-windows-msvc, so no --target flag: output stays in
      # src-tauri/target/release/bundle/.
      #
      # Updater signing needs the TAURI_PRIVATE_KEY secret (secrets do not
      # transfer to forks). An unset secret expands to an empty string, which
      # Tauri v1 tries to parse as a key and fails with
      # "incorrect updater private key password: Missing comment in secret key".
      # So the key env vars are only exported when the secret exists; otherwise
      # we build just MSI + NSIS. With no Updater bundles produced, Tauri
      # skips the signing step entirely instead of failing.
      - name: Build Tauri app (release, signed updater)
        if: ${{ secrets.TAURI_PRIVATE_KEY != '' }}
        run: pnpm tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Tauri app (release, installers only)
        if: ${{ secrets.TAURI_PRIVATE_KEY == '' }}
        run: pnpm tauri build --bundles msi nsis

      - name: List bundles
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle

      - name: Upload Windows x64 installers
        uses: actions/upload-artifact@v4
        with:
          name: Reveal-windows-x64
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 30
