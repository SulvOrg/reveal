name: Build Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Reveal for Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable, Windows x64 MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Runs `beforeBuildCommand` (pnpm build -> dist/) then `cargo build --release`
      # and bundles MSI + NSIS (+ updater artifacts, unsigned unless
      # TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD secrets are configured).
      # Host runner is already x86_64-pc-windows-msvc, so no --target flag:
      # output stays in src-tauri/target/release/bundle/.
      - name: Build Tauri app (release)
        run: pnpm tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: List bundles
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle

      - name: Upload Windows x64 installers
        uses: actions/upload-artifact@v4
        with:
          name: Reveal-windows-x64
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 30
